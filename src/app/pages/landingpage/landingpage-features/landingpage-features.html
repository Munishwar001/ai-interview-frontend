<section id="features" class="py-10 sm:py-16 md:py-20 relative overflow-hidden" style="background: linear-gradient(160deg, #f0f4ff 0%, #faf5ff 50%, #f0fdf4 100%);">
  <!-- Dots - Hidden on mobile -->
  <div class="hidden md:block absolute inset-0" style="
    background-image: radial-gradient(circle, rgba(108,61,232,0.12) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    opacity: 0.8;
  "></div>

  <!-- Blobs - Hidden on mobile -->
  <div class="hidden md:block absolute rounded-full" style="width:400px; height:400px; background: radial-gradient(circle, rgba(99,102,241,0.12), transparent 70%); top:-100px; right:-80px;"></div>
  <div class="hidden md:block absolute rounded-full" style="width:350px; height:350px; background: radial-gradient(circle, rgba(34,197,94,0.08), transparent 70%); bottom:-80px; left:-60px;"></div>

  <!-- Content -->
  <div class="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 text-center">
    <div class="inline-flex items-center gap-2 px-3 sm:px-4 py-1.5 rounded-full bg-indigo-50 text-indigo-600 text-xs sm:text-sm font-medium mb-4 sm:mb-6">
      <app-icon [name]="'sparkles'"></app-icon> AI Powered
    </div>

    <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-slate-900">Supercharge Your Job Search</h2>

    <p class="mt-3 text-sm sm:text-base text-slate-600 max-w-2xl mx-auto px-2">
      Our AI-powered tools help you stand out from the crowd and land your dream job faster.
    </p>

    <div class="mt-8 sm:mt-12 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
      <app-feature-card
        *ngFor="let item of featuresList"
        [icon]="item.icon"
        [title]="item.title"
        [desc]="item.desc"
        [iconBg]="item.iconBg"
      ></app-feature-card>
    </div>
  </div>
</section>
