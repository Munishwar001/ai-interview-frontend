<section class="py-10 sm:py-16 md:py-20 relative overflow-hidden" style="background: linear-gradient(160deg, #f0f4ff 0%, #faf5ff 50%, #f0fdf4 100%);">
  <!-- Dots - Hidden on mobile -->
  <div class="hidden md:block absolute inset-0" style="
    background-image: radial-gradient(circle, rgba(108,61,232,0.12) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    opacity: 0.8;
  "></div>

  <!-- Blobs - Hidden on mobile -->
  <div class="hidden md:block absolute rounded-full" style="width:400px; height:400px; background: radial-gradient(circle, rgba(99,102,241,0.12), transparent 70%); top:-100px; right:-80px;"></div>
  <div class="hidden md:block absolute rounded-full" style="width:350px; height:350px; background: radial-gradient(circle, rgba(34,197,94,0.08), transparent 70%); bottom:-80px; left:-60px;"></div>

  <div class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6">
   <div class="rounded-2xl sm:rounded-3xl p-6 sm:p-10 text-center" style="background: linear-gradient(135deg, #ede9fe 0%, #f5f3ff 40%, #ddd6fe 100%);">
      <!-- Icon -->
      <div class="flex justify-center mb-4 sm:mb-6">
        <div class="w-12 sm:w-14 h-12 sm:h-14 rounded-full bg-indigo-50 flex items-center justify-center">
          <app-icon name="sparkles" class="text-indigo-600 w-5 sm:w-6 h-5 sm:h-6"></app-icon>
        </div>
      </div>

      <!-- Heading -->
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-slate-900">Ready to Transform Your Career?</h2>

      <!-- Subtext -->
      <p class="mt-3 sm:mt-4 text-sm sm:text-base text-slate-600 max-w-xl mx-auto">
        Join thousands of professionals who've already accelerated their job search with AI.
      </p>

      <!-- Buttons -->
      <div class="mt-6 sm:mt-8 flex flex-col items-center justify-center gap-3 sm:gap-4">
        <button
          (click)="onJobSeeker()"
          class="w-full sm:w-auto flex items-center justify-center gap-2 hover:scale-105 active:scale-95 transition-all duration-300 text-white px-4 sm:px-6 py-3 rounded-lg sm:rounded-xl font-semibold shadow-lg text-sm sm:text-base"
          style="background-color: #7375F2;"
        >
          <app-icon name="sparkles"></app-icon>
          <span>Start Your Free Trial</span>
        </button>

        <button
          (click)="onSignIn()"
          class="w-full sm:w-auto bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-4 sm:px-6 py-3 rounded-lg sm:rounded-xl font-medium transition text-sm sm:text-base"
        >
          Sign In
        </button>
      </div>
    </div>
  </div>
</section>
