<section class="py-20 bg-[#F8F5FE]">
  <div class="max-w-4xl mx-auto px-6">
    <div
      class="bg-gradient-to-br from-indigo-100 via-purple-100 to-indigo-200 rounded-3xl p-10 text-center shadow-sm border border-indigo-200"
    >
      <!-- Icon -->
      <div class="flex justify-center mb-4">
        <div class="w-14 h-14 rounded-full bg-white/60 flex items-center justify-center">
          <app-icon name="sparkles" class="text-indigo-600 w-6 h-6"></app-icon>
        </div>
      </div>

      <!-- Heading -->
      <h2 class="text-3xl md:text-4xl font-bold text-slate-900">Ready to Transform Your Career?</h2>

      <!-- Subtext -->
      <p class="mt-4 text-slate-600 max-w-xl mx-auto">
        Join thousands of professionals who've already accelerated their job search with AI.
      </p>

      <!-- Buttons -->
      <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-4">
        <button
          (click)="onJobSeeker()"
          class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 hover:scale-105 active:scale-95 transition-all duration-300 text-white px-6 py-3 rounded-xl font-semibold shadow-lg shadow-indigo-200"
        >
          <app-icon name="sparkles"></app-icon>
          Start Your Free Trial
        </button>

        <button
          (click)="onSignIn()"
          class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-6 py-3 rounded-xl font-medium transition"
        >
          Sign In
        </button>
      </div>
    </div>
  </div>
</section>
