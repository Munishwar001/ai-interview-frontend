<section class="relative min-h-screen flex items-center justify-center bg-[#f4f4f8] overflow-hidden">

  <!-- Blob top-left -->
  <div class="absolute -top-20 sm:-top-40 -left-20 sm:-left-40 w-[260px] sm:w-[520px] h-[260px] sm:h-[520px] rounded-full pointer-events-none floating-background"
    style="background: radial-gradient(circle, rgba(167,139,250,0.35) 0%, rgba(196,181,253,0.15) 50%, transparent 70%); filter: blur(30px) sm:blur(60px);">
  </div>

  <!-- Blob bottom-right -->
  <div class="absolute -bottom-18 sm:-bottom-36 -right-18 sm:-right-36 w-[230px] sm:w-[460px] h-[230px] sm:h-[460px] rounded-full pointer-events-none floating-background"
    style="background: radial-gradient(circle, rgba(167,139,250,0.25) 0%, rgba(196,181,253,0.1) 50%, transparent 70%); filter: blur(30px) sm:blur(60px);">
  </div>

  <!-- Floating Search Icon -->
  <div class="hidden sm:flex absolute top-[18%] left-[11%] w-12 h-12 bg-white rounded-2xl items-center justify-center shadow-lg text-slate-400 floating-icon"
    style="animation-delay: 0s;">
    <app-icon name="search"></app-icon>
  </div>

  <!-- Floating Info Icon -->
  <div class="hidden sm:flex absolute top-[22%] right-[8%] w-11 h-11 bg-white rounded-2xl items-center justify-center shadow-lg text-slate-400 floating-icon"
    style="animation-delay: 1.2s;">
    <app-icon name="info"></app-icon>
  </div>

  <!-- Floating Sparkle Icon -->
  <div class="hidden sm:flex absolute bottom-[28%] right-[14%] w-9 h-9 bg-white rounded-2xl items-center justify-center shadow-lg text-violet-300 floating-icon"
    style="animation-delay: 2.2s;">
    <app-icon name="sparkles"></app-icon>
  </div>

  <!-- Floating Brain Icon -->
  <div class="hidden sm:flex absolute top-[34%] left-[18%] w-10 h-10 bg-white rounded-2xl items-center justify-center shadow-lg text-violet-500 floating-icon"
    style="animation-delay: 0.6s;">
    <app-icon name="brain"></app-icon>
  </div>

  <!-- Floating Circuit Icon -->
  <div class="hidden sm:flex absolute bottom-[36%] left-[24%] w-11 h-11 bg-white rounded-2xl items-center justify-center shadow-lg text-sky-500 floating-icon"
    style="animation-delay: 1.6s;">
    <app-icon name="circuit"></app-icon>
  </div>

  <!-- Dot cluster top-left -->
  <div class="hidden sm:grid absolute top-[15%] left-[20%] grid-cols-3 gap-2">
    <span *ngFor="let d of dotArr" class="w-1.5 h-1.5 rounded-full bg-violet-300/40 block"></span>
  </div>

  <!-- Dot cluster bottom-right -->
  <div class="hidden sm:grid absolute bottom-[18%] right-[18%] grid-cols-3 gap-2">
    <span *ngFor="let d of dotArr" class="w-1.5 h-1.5 rounded-full bg-violet-300/40 block"></span>
  </div>

  <!-- Main content -->
  <div class="relative z-10 flex flex-col items-center text-center px-4 sm:px-6 py-8 sm:py-10 slide-up max-w-full">

    <!-- 404 -->
    <h1 class="leading-none mb-2 text-6xl sm:text-8xl md:text-[220px] font-extrabold tracking-wider text-[#674EE9]">
      404
    </h1>

    <!-- Title -->
    <h2 class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold text-slate-900 tracking-tight mb-3 slide-up" style="animation-delay: 0.1s;">
      Oops! Page not found
    </h2>

    <!-- Sub text -->
    <p class="text-sm sm:text-[15px] text-slate-500 max-w-xs sm:max-w-sm leading-relaxed mb-6 slide-up" style="animation-delay: 0.25s;">
      The page you are looking for doesn't exist or has been moved.
    </p>

    <!-- AI Badge -->
    <div class="inline-flex items-center gap-2 px-3 sm:px-4 py-2 bg-white border border-slate-200 rounded-full text-xs sm:text-[13px] text-slate-500 shadow-sm mb-6 slide-up" style="animation-delay: 0.4s;">
      <span class="text-sm sm:text-base leading-none">🤖</span>
      Even our AI couldn't find this page
    </div>

    <!-- Dots row -->
    <div class="flex gap-1.5 mb-8 loading-dots">
      <span class="w-2 h-2 rounded-full bg-slate-300 loading-dot"></span>
      <span class="w-2 h-2 rounded-full bg-violet-600 loading-dot"></span>
      <span class="w-2 h-2 rounded-full bg-slate-300 loading-dot"></span>
      <span class="w-2 h-2 rounded-full bg-slate-300 loading-dot"></span>
      <span class="w-2 h-2 rounded-full bg-slate-300 loading-dot"></span>
    </div>

    <!-- Buttons -->
    <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
      <button
        (click)="goHome()"
        class="flex items-center justify-center gap-2 bg-[#6658EC] hover:bg-[#5b4fe8] text-white font-semibold text-sm px-4 sm:px-6 py-3 rounded-full shadow-lg shadow-violet-500/30 hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer border-none w-full sm:w-auto"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Go Back Home
      </button>

      <button
        (click)="searchJobs()"
        class="flex items-center justify-center gap-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-800 font-semibold text-sm px-4 sm:px-6 py-3 rounded-full shadow-sm hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer w-full sm:w-auto"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Search Jobs
      </button>
    </div>
  </div>

</section>

<style>
  @keyframes floatY {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-10px); }
  }

  .floating-background {
    animation: floatY 12s ease-in-out infinite;
  }

  .floating-icon {
    animation: floatY 4s ease-in-out infinite;
  }

  .loading-dot {
    animation: dotPulse 1.1s ease-in-out infinite;
  }

  .loading-dot:nth-child(1) { animation-delay: 0s; }
  .loading-dot:nth-child(2) { animation-delay: 0.15s; }
  .loading-dot:nth-child(3) { animation-delay: 0.3s; }
  .loading-dot:nth-child(4) { animation-delay: 0.45s; }
  .loading-dot:nth-child(5) { animation-delay: 0.6s; }

  .slide-up {
    animation: slideUp 0.7s ease-out forwards;
    opacity: 0;
    transform: translateY(45px);
  }

  @keyframes slideUp {
    to {
      opacity: 1;
      transform: translateY(0);        
    }
  }

  @keyframes dotPulse {
    0%, 100% {
      transform: scale(1);
      opacity: 0.45;
    }
    50% {
      transform: scale(1.4);
      opacity: 1;
    }
  }
</style>
