<nav class="w-full bg-white/80 backdrop-blur-xl border-b border-slate-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex items-center justify-between">
    <!-- Logo -->
    <a routerLink="/" (click)="closeMobileMenu()" class="flex items-center gap-2 sm:gap-3 no-underline">
      <div class="w-8 sm:w-10 h-8 sm:h-10 rounded-lg sm:rounded-2xl flex items-center justify-center shadow-md"
  style="background: linear-gradient(135deg, #6c3de8, #a78bfa)">
  <app-icon [name]="'logo'"></app-icon>
</div>
      <span class="text-lg sm:text-2xl font-bold text-slate-900 tracking-tight">
        Job<span class="bg-gradient-to-r from-[#6c3de8] to-[#a78bfa] bg-clip-text text-transparent">AI</span>
      </span>
    </a>

    <!-- Nav Links - Hidden on mobile, visible on desktop -->
    <ul class="hidden lg:flex items-center gap-8 list-none m-0 p-0">
      <li *ngFor="let link of navLinks">
        <a
          [routerLink]="link.route"
          [fragment]="link.fragment"
          class="text-sm font-medium text-slate-600 hover:text-indigo-600 transition-all duration-200 no-underline"
        >
          {{ link.label }}
        </a>
      </li>
    </ul>

    <!-- Right Side -->
    <div class="flex items-center gap-2 sm:gap-4">
      <!-- Theme Toggle -->
      <button
        type="button"
        (click)="toggleTheme()"
        class="p-1.5 sm:p-2.5 rounded-lg sm:rounded-xl text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 transition cursor-pointer"
      >
        <app-icon [name]="isDark ? 'sun' : 'moon'"></app-icon>
      </button>

      <!-- Sign In - Hidden on mobile, text on tablet -->
      <button
        type="button"
        (click)="onSignIn()"
        class="hidden sm:block text-xs sm:text-sm font-medium text-slate-700 hover:text-indigo-600 transition cursor-pointer"
      >
        Sign In
      </button>

      <!-- Mobile Menu Button - Visible only on mobile and tablet (lg:hidden) -->
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="lg:hidden p-1.5 sm:p-2.5 rounded-lg text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 transition cursor-pointer"
      >
        <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Get Started -->
      <button
  type="button"
  (click)="onGetStarted()"
  class="flex items-center gap-1 sm:gap-2 
  bg-[#7375F2] hover:bg-[#5f61e6] 
  hover:scale-105 active:scale-95 
  transition-all duration-300 
  text-white px-3 sm:px-4 py-2 rounded-lg sm:rounded-xl font-semibold text-xs sm:text-sm
  shadow-lg shadow-[#7375F2]/30"
>
  <app-icon [name]="'sparkles'"></app-icon>
  <span class="hidden sm:inline">Get Started</span>
  <span class="sm:hidden">Start</span>
</button>
    </div>
  </div>

  <!-- Mobile Navigation Dropdown - Visible only on mobile/tablet when menu is open -->
  <div 
    *ngIf="isMobileMenuOpen"
    class="lg:hidden border-t border-slate-200 bg-white/95 backdrop-blur-md"
  >
    <div class="px-4 py-4 space-y-2">
      <!-- Mobile Nav Links -->
      <a
        *ngFor="let link of navLinks"
        [routerLink]="link.route"
        [fragment]="link.fragment"
        (click)="closeMobileMenu()"
        class="flex items-center px-4 py-3 text-sm font-medium text-slate-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all duration-200 no-underline"
      >
        {{ link.label }}
      </a>

      <!-- Mobile Sign In (shown only on mobile, hidden on tablet sm:) -->
      <button
        type="button"
        (click)="onSignIn()"
        class="sm:hidden w-full flex items-center justify-center px-4 py-3 text-sm font-medium text-slate-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all duration-200 border border-slate-200"
      >
        Sign In
      </button>

      <!-- Mobile Get Started Button -->
      <button
        type="button"
        (click)="onGetStarted()"
        class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-[#7375F2] hover:bg-[#5f61e6] text-white font-semibold text-sm rounded-lg transition-all duration-200"
      >
        <app-icon [name]="'sparkles'"></app-icon>
        Get Started
      </button>
    </div>
  </div>
</nav>
<router-outlet></router-outlet>
