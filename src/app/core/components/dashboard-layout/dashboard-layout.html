<!-- dashboard-layout.html -->
<div class="flex h-screen bg-gray-50 font-sans overflow-hidden w-full flex-col-reverse sm:flex-row">
  <!-- Sidebar - Hidden on mobile by default -->
  <app-sidebar
    [isSidebarOpen]="isSidebarOpen"
    [menuItems]="menuItems"
    (logout)="handleLogout()">
  </app-sidebar>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <!--  Navbar used as a reusable component -->
    <app-navbar [title]="pageTitle" (toggleSidebar)="toggleSidebar()"></app-navbar>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-4 md:p-6">
      <router-outlet></router-outlet>
    
    </main>
  </div>
</div>
