<!-- dashboard-layout.html -->
<div class="flex h-screen bg-gray-50 font-sans overflow-hidden w-full">

  <!-- Sidebar -->
  <app-sidebar
    [isSidebarOpen]="isSidebarOpen"
    [menuItems]="menuItems"
    (logout)="handleLogout()">
  </app-sidebar>

  <!-- Mobile backdrop when sidebar open -->
  <div *ngIf="isSidebarOpen && isMobile"
       class="fixed inset-0 bg-black/30 z-30 sm:hidden"
       (click)="toggleSidebar()">
  </div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <app-navbar [title]="pageTitle" (toggleSidebar)="toggleSidebar()"></app-navbar>
    <main class="flex-1" [ngClass]="isFullBleedRoute ? 'p-0 overflow-hidden' : 'p-3 sm:p-4 md:p-6 overflow-y-auto'">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
