<!-- dashboard-layout.html -->
<div class="flex h-screen bg-gray-50 font-sans overflow-hidden  w-full">
  <!-- Sidebar -->
<app-sidebar
  [isSidebarOpen]="isSidebarOpen"
  [menuItems]="menuItems"
    (logout)="handleLogout()">
</app-sidebar>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <!--  Navbar used as a reusable component -->
    <app-navbar [title]="pageTitle"   (toggleSidebar)="toggleSidebar()"></app-navbar>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet></router-outlet>
    
    </main>
  </div>
</div>
