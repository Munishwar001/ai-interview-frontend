<section class="mock-interview-page">
  <div class="hero-shell">
    <div class="hero-copy">
      <span class="eyebrow">AI Mock Interview</span>
      <h1>Practice with a focused mock interview experience.</h1>
      <p>Sharpen your skills with AI-powered feedback and real interview scenarios.</p>

      <div class="actions">
        <button class="primary-btn" (click)="startInterview()">Start Interview</button>
        <button class="tertiary-btn" (click)="startInterview()">Ask Interview</button>
      </div>

      <ul class="stats">
        <li><span>01</span> Animated avatar</li>
        <li><span>02</span> Real-time feedback</li>
        <li><span>03</span> Interview flow ready</li>
      </ul>
    </div>

    <div class="animation-stage">
      <div class="animation-placeholder">
        <div #lottieContainer class="lottie-host"></div>
      </div>
    </div>
  </div>
</section>
