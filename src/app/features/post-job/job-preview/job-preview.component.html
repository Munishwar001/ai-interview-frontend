<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-xl p-6 w-full max-w-2xl mx-4">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-base font-semibold text-gray-800">Job Preview</h3>
      <button type="button" (click)="close()"
        class="text-gray-400 hover:text-gray-600 transition-colors cursor-pointer">
         <app-icon name="close"></app-icon>
      </button>
    </div>

    <!-- Card -->
    <div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">
      <div class="flex items-start gap-4">

        <!-- Icon -->
        <div class="flex h-14 w-14 items-center justify-center rounded-xl bg-indigo-50 shrink-0">
          <app-icon name="jobseeker" class="text-indigo-500"></app-icon>
        </div>

        <!-- Info -->
        <div class="flex flex-col gap-1">
          <h2 class="text-lg font-bold text-gray-900">{{ jobdata?.title || 'Job Title' }}</h2>
          <p class="text-sm text-gray-500">Your Company</p>

          <div class="mt-1 flex items-center gap-4 text-xs text-gray-400 flex-wrap">
            <span class="flex items-center gap-1" *ngIf="jobdata?.location">
              <app-icon name="location"></app-icon>
              {{ jobdata?.location }}
            </span>
            <span class="flex items-center gap-1" *ngIf="jobdata?.salaryMin || jobdata?.salaryMax">
              <app-icon name="currency"></app-icon>
              ${{ jobdata?.salaryMin }} - ${{ jobdata?.salaryMax }}
            </span>
            <span class="flex items-center gap-1" *ngIf="jobdata?.jobType">
              <app-icon name="briefcase"></app-icon>
              {{ jobdata?.jobType }}
            </span>
          </div>
        </div>
      </div>

      <!-- Skills -->
      <div class="mt-3 flex flex-wrap gap-2" *ngIf="selectedSkills.length > 0">
        <span *ngFor="let skill of selectedSkills"
          class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-purple-100 text-purple-700 border border-purple-200">
          {{ skill.name }}
        </span>
      </div>

      <div class="my-4 border-t border-gray-100"></div>

      <p class="text-sm text-gray-500 whitespace-pre-line">
        {{ jobdata?.description || 'Job description will appear here...' }}
      </p>
    </div>

  </div>
</div>
