<div class="min-h-screen bg-gray-50 px-6 py-10">

  <!-- Header -->
  <div class="flex items-center justify-between mb-8">
    <div>
      <div class="flex items-center gap-3 mb-1">
        <h1 class="text-3xl font-bold text-gray-900">Post New Job</h1>
        <app-powered-badge text="AI Powered"></app-powered-badge>
      </div>
      <p class="text-gray-500 text-sm">Create your job listing with AI-powered description generation</p>
    </div>

    <div class="flex items-center gap-3">
      <button type="button" (click)="onPreview()"
        class="flex items-center gap-2 px-4 py-2 rounded-lg border border-gray-300 text-gray-700 text-sm font-medium bg-white hover:bg-gray-50 transition-colors duration-150 cursor-pointer">
        <app-icon name="eye" class="w-4 h-4"></app-icon>
        Preview
      </button>
      <button type="button" (click)="onSubmit()"
        class="inline-flex items-center justify-center whitespace-nowrap rounded-lg text-sm font-medium transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-[#7375F2] text-white hover:bg-[#5C5EDB] shadow-sm hover:shadow-md h-10 px-4 py-2 gap-2">
        <app-icon name="send" class="size-4"></app-icon>
        Post Job
      </button>
    </div>
  </div>

  <!-- Form -->
  <form [formGroup]="jobForm" (ngSubmit)="onSubmit()"
    class="grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-5xl mx-auto">

    <!-- Left: Job Details -->
    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
      <h2 class="text-lg font-semibold text-gray-900 mb-1">Job Details</h2>
      <p class="text-sm text-gray-500 mb-6">Basic information about the position</p>

      <!-- Job Title -->
      <div class="mb-5">
        <app-input label="Job Title" controlName="title" placeholder="e.g., Senior Frontend Developer">
        </app-input>
      </div>

      <!-- Location & Job Type -->
      <div class="grid grid-cols-2 gap-4 mb-5">
        <div>
          <app-input label="Location" controlName="location" placeholder="e.g., San Francisco, CA">
          </app-input>
        </div>
        <div>
          <app-select label="Job Type" controlName="jobType" placeholder="Select type"
            [options]="jobTypeOptions"/>
        </div>
      </div>

      <!-- Salary Range -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Salary Range</label>
        <div class="grid grid-cols-2 gap-3">
          <input type="number" formControlName="salaryMin" placeholder="Min (e.g. 80000)"
            class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" />
          <input type="number" formControlName="salaryMax" placeholder="Max (e.g. 150000)"
            class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" />
        </div>
      </div>

      <!-- Required Skills -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Required Skills</label>

        <!-- Selected Skill Tags -->
        <div class="flex flex-wrap gap-2 mb-2" *ngIf="selectedSkills.length > 0">
          <span *ngFor="let skill of selectedSkills"
            class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-purple-100 text-purple-700 border border-purple-200">
            {{ skill.name }}
            <button type="button" (click)="removeSkill(skill)"
              class="hover:text-purple-900 transition-colors cursor-pointer">
              <app-icon name="close" class="w-3 h-3"></app-icon>
            </button>
          </span>
        </div>

        <!-- Input & Dropdown -->
        <div class="relative">
          <input type="text" [(ngModel)]="skillSearch" [ngModelOptions]="{standalone: true}"
            (input)="onSkillSearch()" (focus)="showDropdown = true" (blur)="onBlur()"
            placeholder="Type to search skills..."
            class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" />

          <!-- Dropdown Results -->
          <div *ngIf="showDropdown && filteredSkills.length > 0"
            class="absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden">
            <ul class="max-h-48 overflow-y-auto py-1">
              <li *ngFor="let skill of filteredSkills" (mousedown)="selectSkill(skill)"
                class="flex items-center gap-2 px-4 py-2.5 text-sm text-gray-700 hover:bg-purple-50 hover:text-purple-700 cursor-pointer transition-colors">
                <app-icon name="star" class="w-3.5 h-3.5 text-purple-400 shrink-0"></app-icon>
                <span [innerHTML]="highlightMatch(skill.name)"></span>
              </li>
            </ul>
          </div>

          <!-- No Results -->
          <div *ngIf="showDropdown && skillSearch.length > 0 && filteredSkills.length === 0"
            class="absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-xl shadow-lg px-4 py-3 text-sm text-gray-400">
            No skills found for "<strong class="text-gray-600">{{ skillSearch }}</strong>"
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Job Description -->
    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm flex flex-col">

      <div class="flex items-start justify-between mb-1">
        <h2 class="text-lg font-semibold text-gray-900">Job Description</h2>
        <div class="flex items-center gap-2">
          <app-powered-badge text="AI Powered"></app-powered-badge>

          <!-- Generate Button -->
          <button type="button" (click)="generateWithAI()" [disabled]="isGenerating || isTyping"
            class="flex items-center gap-2 px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-700 disabled:opacity-60 disabled:cursor-not-allowed text-white text-xs font-semibold transition-colors duration-150 cursor-pointer shadow-sm">

            <!-- Spinner while generating -->
            <app-icon *ngIf="isGenerating || isTyping" name="spinner" class="w-3.5 h-3.5 animate-spin"></app-icon>

            <!-- Star icon when idle -->
            <app-icon *ngIf="!isGenerating && !isTyping" name="star" class="w-3.5 h-3.5"></app-icon>

            {{ isGenerating ? 'Generating...' : isTyping ? 'Writing...' : 'Generate with AI' }}
          </button>
        </div>
      </div>
      <p class="text-sm text-gray-500 mb-4">Let AI create a compelling job description based on your inputs</p>

      <div
        #descriptionBox
        contenteditable="true"
        (input)="onDescriptionInput($event)"
        class="description-box flex-1 w-full min-h-64 px-3.5 py-3 rounded-lg border border-gray-300 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition overflow-y-auto prose prose-sm max-w-none">
      </div>

    </div>

  </form>

  <app-job-preview #preview [jobdata]="jobForm.value" [selectedSkills]="selectedSkills">
  </app-job-preview>

</div>
