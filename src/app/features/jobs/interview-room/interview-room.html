<div class="min-h-screen bg-gray-50 px-4 py-6 sm:px-6 sm:py-8">
  <div class="max-w-6xl mx-auto">
    <div class="bg-white border border-gray-200 rounded-2xl p-4 sm:p-5 mb-4 shadow-sm">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <p class="text-xs uppercase tracking-wider text-violet-500 font-semibold">Live Interview</p>
          <h1 class="text-lg sm:text-xl font-bold text-gray-900">Interview Room #{{ interviewId }}</h1>
        </div>

        <div class="flex flex-wrap gap-2">
          <button
            (click)="toggleMic()"
            class="px-4 py-2 rounded-xl text-sm font-semibold border transition flex items-center gap-2"
            [class]="micEnabled() ? 'bg-white border-gray-200 text-gray-700 hover:bg-gray-50' : 'bg-red-50 border-red-200 text-red-700'"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              @if (micEnabled()) {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
              } @else {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
              }
            </svg>
            {{ micEnabled() ? 'Mute Mic' : 'Unmute Mic' }}
          </button>

          <button
            (click)="toggleCamera()"
            class="px-4 py-2 rounded-xl text-sm font-semibold border transition flex items-center gap-2"
            [class]="cameraEnabled() ? 'bg-white border-gray-200 text-gray-700 hover:bg-gray-50' : 'bg-red-50 border-red-200 text-red-700'"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              @if (cameraEnabled()) {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              } @else {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              }
            </svg>
            {{ cameraEnabled() ? 'Turn Camera Off' : 'Turn Camera On' }}
          </button>

          <button
            (click)="leaveRoom()"
            class="px-4 py-2 rounded-xl text-sm font-semibold bg-red-500 text-white hover:bg-red-600 transition flex items-center gap-2"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="white">
              <path d="M21 15.46l-5.27-.61a1 1 0 0 0-.9.27l-2.2 2.2a15.05 15.05 0 0 1-6.63-6.63l2.2-2.2a1 1 0 0 0 .27-.9L8.54 3a1 1 0 0 0-1-.76H3a1 1 0 0 0-1 1C2 13.28 10.72 22 20.76 22a1 1 0 0 0 1-1v-4.54a1 1 0 0 0-.76-1z"/>
            </svg>
            Leave
          </button>
        </div>
      </div>

      @if (isJoining()) {
        <p class="text-sm text-gray-500 mt-3">Joining interview room...</p>
      }
      @if (errorMessage()) {
        <p class="text-sm text-red-600 mt-3">{{ errorMessage() }}</p>
      }
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
        <p class="text-xs font-semibold text-gray-500 mb-2">Your Video</p>
        <video
          #localVideo
          autoplay
          playsinline
          muted
          class="w-full aspect-video rounded-xl bg-gray-900 object-cover"
        ></video>
      </div>

      <div class="bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
        <p class="text-xs font-semibold text-gray-500 mb-2">Candidate Video</p>
        <video
          #remoteVideo
          autoplay
          playsinline
          class="w-full aspect-video rounded-xl bg-gray-900 object-cover"
        ></video>

        @if (!hasRemote()) {
          <p class="text-xs text-gray-500 mt-2">Waiting for participant to join...</p>
        }
      </div>
    </div>

    <div class="mt-4">
      <a routerLink="/dashboard/interviews" class="text-sm font-medium text-violet-700 hover:underline">
        Back to interviews
      </a>
    </div>
  </div>
</div>
