<div class="h-screen overflow-hidden bg-[#F8F5FE] flex flex-col">

    <!-- Header -->
    <header class="px-8 py-3 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center">
            <app-icon [name]="'logo'"></app-icon>
            </div>
            <span class="text-xl font-bold text-slate-800">Job<span class="text-indigo-600">AI</span></span>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 flex items-center justify-center px-4 overflow-hidden">
        <div
            class="w-full max-w-md bg-white rounded-2xl shadow-lg shadow-slate-200/80 border border-slate-100 px-10 py-6">

            <!-- Title -->
            <div class="text-center mb-5">
                <h1 class="text-2xl font-bold text-slate-800 mb-1">Create Your Account</h1>
                <p class="text-sm text-slate-400">Start your AI-powered job journey today</p>
            </div>

            <!-- Intent Toggle -->
            <div class="mb-4">
                <p class="text-sm font-medium text-slate-700 mb-2">I want to</p>
                <div class="grid grid-cols-2 gap-2">
                    <button (click)="setIntent('find')"
                        [class]="selectedIntent === 'find'
              ? 'flex flex-col items-center justify-center gap-1.5 py-3 rounded-xl border-2 border-[#7375F2] bg-[#7375F2] text-white font-semibold text-sm transition-all'
              : 'flex flex-col items-center justify-center gap-1.5 py-3 rounded-xl border-2 border-slate-200 bg-white text-slate-500 font-semibold text-sm hover:border-indigo-300 hover:text-indigo-500 transition-all'">
                        <app-icon name="jobseeker"></app-icon>
                        Find Jobs
                    </button>
                    <button (click)="setIntent('hire')"
                        [class]="selectedIntent === 'hire'
              ? 'flex flex-col items-center justify-center gap-1.5 py-3 rounded-xl border-2 border-[#7375F2] bg-[#7375F2] text-white font-semibold text-sm transition-all'
              : 'flex flex-col items-center justify-center gap-1.5 py-3 rounded-xl border-2 border-slate-200 bg-white text-slate-500 font-semibold text-sm hover:border-indigo-300 hover:text-indigo-500 transition-all'">
                    <app-icon name="employer"></app-icon>
                        Hire Talent
                    </button>
                </div>
            </div>

            <!-- Full Name -->
            <div class="mb-3">
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
                <input type="text" [(ngModel)]="fullName" placeholder="John Doe"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-slate-800 text-sm placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" />
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                <input type="email" [(ngModel)]="email" placeholder="you@example.com"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-slate-800 text-sm placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" />
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                <div class="relative">
                    <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="••••••••••"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-slate-800 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all pr-10" />
                    <button type="button" (click)="togglePassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
                        <app-icon [name]="showPassword ? 'eye-off' : 'eye'"></app-icon>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirm Password</label>
                <div class="relative">
                    <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword"
                        placeholder="••••••••••"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-slate-800 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all pr-10" />
                    <button type="button" (click)="toggleConfirmPassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
                        <app-icon [name]="showConfirmPassword ? 'eye-off' : 'eye'"></app-icon>
                    </button>
                </div>
            </div>

            <!-- Create Account Button -->
            <button (click)="onCreateAccount()"
                class="w-full py-3 rounded-lg bg-[#7375F2] hover:bg-[#5a5cda] active:bg-[#4143b0] text-white font-semibold text-sm tracking-wide transition-all duration-150 shadow-sm shadow-indigo-200 flex items-center justify-center gap-2 mb-4">
                <app-icon name="sparkles"></app-icon>
                Create Account
            </button>

            <!-- Sign In Link -->
            <p class="text-center text-sm text-slate-400 mb-2">
                Already have an account?
                <a href="/login" class="text-[#7375F2] font-semibold hover:text-indigo-700 transition-colors ml-1">Sign
                    in</a>
            </p>

            <!-- Terms -->
            <p class="text-center text-xs text-slate-400 leading-relaxed">
                By creating an account, you agree to our
                <a href="#" class="text-[#7375F2] hover:text-indigo-700 transition-colors">Terms of Service</a>
                and
                <a href="#" class="text-[#7375F2] hover:text-indigo-700 transition-colors">Privacy Policy</a>
            </p>

        </div>
    </main>
</div>
