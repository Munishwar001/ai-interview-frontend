<div class="min-h-screen bg-[#F8F5FE] flex flex-col">
  <!-- Header -->
  <header class="px-4 sm:px-6 md:px-8 py-3 sm:py-4 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 sm:w-9 h-8 sm:h-9 bg-indigo-600 rounded-lg sm:rounded-xl flex items-center justify-center">
        <app-icon [name]="'logo'"></app-icon>
      </div>
      <span class="text-lg sm:text-xl font-bold text-slate-800">Job<span class="text-indigo-600">AI</span></span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 py-6 sm:py-8 overflow-auto">
    <div class="w-full max-w-md bg-white rounded-xl sm:rounded-2xl shadow-lg shadow-slate-200/80 border border-slate-100 px-4 sm:px-8 md:px-10 py-6 sm:py-8">
      <div class="text-center mb-6 sm:mb-8">
        <div class="w-12 h-12 mx-auto mb-4 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
          <app-icon name="mail" class="w-6 h-6"></app-icon>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-800 mb-1">Forgot Password</h1>
        <p class="text-xs sm:text-sm text-slate-400">Enter your email and we’ll send you a reset link.</p>
      </div>

      <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetLink()">
        <div class="mb-5 sm:mb-6">
          <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1.5">Email</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
              <app-icon name="mail" class="w-4 h-4"></app-icon>
            </span>
            <input
              type="email"
              formControlName="email"
              placeholder="you@example.com"
              class="w-full pl-10 pr-3 sm:pr-4 py-2.5 sm:py-3 rounded-lg border text-slate-800 text-xs sm:text-sm placeholder-slate-300 focus:outline-none focus:ring-2 transition-all"
              [class.border-red-400]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
              [class.focus:ring-red-400]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
              [class.focus:ring-indigo-500]="!(forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched)"
              [class.border-slate-200]="!(forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched)"
            />
          </div>
          <p *ngIf="forgotPasswordForm.get('email')?.hasError('required') && forgotPasswordForm.get('email')?.touched" class="mt-1.5 text-xs text-red-500">
            Email is required.
          </p>
          <p *ngIf="forgotPasswordForm.get('email')?.hasError('email') && forgotPasswordForm.get('email')?.touched" class="mt-1.5 text-xs text-red-500">
            Please enter a valid email address.
          </p>
        </div>

        <button
          type="submit"
          [disabled]="isSubmitting"
          class="w-full py-2.5 sm:py-3 rounded-lg bg-[#7375F2] hover:bg-[#5a5cda] active:bg-[#4143b0] disabled:opacity-70 disabled:cursor-not-allowed text-white font-semibold text-xs sm:text-sm tracking-wide transition-all duration-150 shadow-sm shadow-indigo-200"
        >
          {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
        </button>

        <p *ngIf="requestSent" class="mt-4 text-sm text-emerald-600 text-center">
          If the email exists, a reset link has been sent.
        </p>
      </form>

      <p class="text-center text-sm text-slate-400 mt-6">
        Remembered your password?
        <a routerLink="/login" class="text-[#7375F2] font-semibold hover:text-indigo-700 transition-colors ml-1">Back to login</a>
      </p>
    </div>
  </main>
</div>
