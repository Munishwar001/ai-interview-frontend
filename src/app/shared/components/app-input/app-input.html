<div class="mb-5">
  <label class="block text-sm font-medium text-gray-700 mb-1.5">
    {{ label }}
  </label>

  <input
    [type]="type"
    [formControl]="control"
    [placeholder]="placeholder"
    class="w-full px-3.5 py-2.5 rounded-lg border text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
    [class.border-red-400]="control.invalid && control.touched"
    [class.border-gray-300]="!(control.invalid && control.touched)"
  />

  <p *ngIf="control.invalid && control.touched" class="mt-1 text-xs text-red-500">
    <span *ngIf="control.errors?.['required']">This field is required</span>
    <span *ngIf="control.errors?.['minlength']">Minimum length required</span>
  </p>
</div>
