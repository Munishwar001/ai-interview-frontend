<!-- sidebar.html -->
<aside
  [ngClass]="{
    'w-64': isSidebarOpen,
    'w-20': !isSidebarOpen,
    'hidden sm:w-64 sm:flex md:w-64': !isSidebarOpen,
    'sm:w-64': isSidebarOpen,
  }"
  class="h-full transition-all duration-300 border-r border-gray-100 flex flex-col shadow-sm shrink-0 relative"
  style="background-color: #f9fafb"
>
  <!-- Logo -->
  <div class="flex items-center gap-2 px-4 sm:px-5 py-4 sm:py-5 border-b border-gray-100">
    <div
      class="w-8 sm:w-9 h-8 sm:h-9 bg-indigo-600 rounded-lg sm:rounded-xl flex items-center justify-center shrink-0"
    >
      <app-icon [name]="'logo'"></app-icon>
    </div>
    <span
      class="text-lg sm:text-xl font-bold text-slate-800 overflow-hidden whitespace-nowrap"
      *ngIf="isSidebarOpen"
    >
      Job<span class="text-indigo-600">AI</span>
    </span>
  </div>

  <!-- Menu Label -->
  <div class="px-4 sm:px-5 pt-4 sm:pt-5 pb-1" *ngIf="isSidebarOpen">
    <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Menu</span>
  </div>

  <!-- Nav Links -->
  <nav class="flex-1 px-2 sm:px-3 space-y-0.5 overflow-y-auto mt-2">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="bg-violet-50 text-violet-700 font-medium"
      [routerLinkActiveOptions]="{ exact: item.exact || false }"
      class="flex items-center gap-2 sm:gap-3 px-2 sm:px-3 py-2 sm:py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 text-xs sm:text-sm transition-colors"
      [ngClass]="{ 'justify-center': !isSidebarOpen }"
    >
      <app-icon [name]="item.icon"></app-icon>
      <span class="flex-1" *ngIf="isSidebarOpen">{{ item.label }}</span>
      <span
        *ngIf="item.badge && isSidebarOpen"
        class="text-[8px] sm:text-[10px] font-semibold bg-violet-100 text-violet-700 px-1.5 py-0.5 rounded-full"
      >
        {{ item.badge }}
      </span>
    </a>
  </nav>

  <!-- User Profile at bottom -->
  <div class="px-3 sm:px-4 py-3 sm:py-4 border-t border-gray-100 relative">
    <!-- Popup Menu (appears above) -->
    <div
      *ngIf="isProfileMenuOpen"
      class="absolute bottom-full left-2 sm:left-3 right-2 sm:right-3 mb-2 bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden z-50"
    >
      <!-- Profile option -->
      <a
        routerLink="/dashboard/profile"
        (click)="closeProfileMenu()"
        class="flex items-center gap-3 px-4 py-3 text-xs sm:text-sm text-gray-700 hover:bg-gray-50 transition-colors"
      >
        <app-icon name="profile"></app-icon>
        Profile
      </a>

      <!-- Settings option -->
      <a
        routerLink="/dashboard/settings"
        (click)="closeProfileMenu()"
        class="flex items-center gap-3 px-4 py-3 text-xs sm:text-sm text-gray-700 hover:bg-gray-50 transition-colors"
      >
        <app-icon name="settings"></app-icon>
        Settings
      </a>

      <!-- Divider -->
      <div class="border-t border-gray-100 mx-3"></div>

      <!-- Logout option -->
      <button
        (click)="onLogout()"
        class="flex items-center gap-3 px-4 py-3 text-xs sm:text-sm text-red-500 hover:bg-red-50 transition-colors w-full text-left"
      >
        <app-icon name="logout"></app-icon>
        Logout
      </button>
    </div>

    <!-- User Profile Row (clickable) -->
    <button
      (click)="toggleProfileMenu()"
      class="flex items-center gap-2 sm:gap-3 w-full text-left rounded-lg hover:bg-gray-100 p-1 sm:p-1.5 transition-colors text-xs sm:text-sm"
      [ngClass]="{ 'justify-center': !isSidebarOpen }"
    >
      <!-- Avatar — now shows first letter of real name -->
      <div
        class="w-7 sm:w-8 h-7 sm:h-8 rounded-full bg-violet-200 text-violet-700 flex items-center justify-center font-semibold text-xs shrink-0"
      >
        {{ avatarLetter }}
      </div>

      <!-- Name & Email (only when sidebar is open) -->
      <ng-container *ngIf="isSidebarOpen">
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-gray-800 truncate">
            {{ userState?.fullName || 'User' }}
          </p>
          <p class="text-xs text-gray-400 truncate">{{ userState?.email || '' }}</p>
        </div>

        <!-- Chevron -->
        <svg
          class="w-4 h-4 text-gray-400 transition-transform duration-200 shrink-0"
          [ngClass]="{ 'rotate-180': isProfileMenuOpen }"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </ng-container>
    </button>
  </div>
</aside>

<!-- Backdrop to close menu when clicking outside -->
<div *ngIf="isProfileMenuOpen" (click)="closeProfileMenu()" class="fixed inset-0 z-40"></div>
